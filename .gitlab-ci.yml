# ---------------------------------------------------------------------------
# Pipeline do blog do Traqto
#
#   * publicar no Sanity  -> webhook -> trigger  -> job `pages`  -> site no ar
#   * push na branch principal                   -> job `pages`  -> site no ar
#   * agendamento mensal                         -> job `backup` -> .tar.gz do conteudo
#
# Tudo roda no plano gratuito do GitLab, que permite uso comercial.
# ---------------------------------------------------------------------------

default:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  # `npm ci` reproduz exatamente o package-lock.json — build identico toda vez.
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  GIT_DEPTH: '1'

stages:
  - verificar
  - publicar
  - backup

# --- Verificacao em branches e merge requests -------------------------------
# Nao publica nada: so garante que o build passa antes de chegar na principal.
verificar:
  stage: verificar
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Com merge request aberto, o push cria dois pipelines (o da branch e o do
    # MR). Sem esta regra, o mesmo build rodaria duas vezes e consumiria o
    # dobro da cota mensal de CI. Fica no escopo do job de proposito: um
    # `workflow:rules` global mal escrito poderia suprimir o pipeline do
    # webhook do Sanity, que e o mecanismo central do projeto.
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npm run typecheck
    - npm run build

# --- Build + publicacao no GitLab Pages -------------------------------------
# Roda em: push na branch principal, "Run pipeline" manual e trigger do webhook
# do Sanity (CI_PIPELINE_SOURCE == "trigger").
pages:
  stage: publicar
  rules:
    # O agendamento existe so para o backup; ele nao republica o site.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Webhook do Sanity (trigger token). Esta regra e o coracao do projeto:
    # sem ela, publicar um post nao republica o site. Usa CI_COMMIT_REF_NAME,
    # que existe em qualquer tipo de pipeline, em vez de depender de
    # CI_COMMIT_BRANCH estar definido no pipeline de trigger.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    # Push na branch principal e execucao manual ("Run pipeline").
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npm run build
  # Sintaxe atual do GitLab Pages: `publish` aponta direto para o diretorio
  # gerado pelo build. Antes era preciso renomear `out/` para `public/`, porque
  # o Pages so publicava esse nome fixo.
  pages:
    publish: out
  artifacts:
    paths:
      - out
    expire_in: 1 week
  environment:
    name: producao
    url: $CI_PAGES_URL

# --- Backup mensal do conteudo ----------------------------------------------
# Criar em CI/CD > Schedules um agendamento mensal com a variavel
# EXECUTAR_BACKUP = true. Sem essa variavel o agendamento nao faz nada.
backup:
  stage: backup
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $EXECUTAR_BACKUP == "true"
  script:
    - npm ci
    - bash ci/backup-dataset.sh
  artifacts:
    name: 'backup-sanity-$CI_COMMIT_REF_SLUG'
    paths:
      - backups/
    # `always` porque o .tar.gz e gerado ANTES do envio externo: se o upload
    # falhar (chave expirada, bucket errado, rede), o padrao do GitLab
    # (on_success) jogaria fora um backup que ja existia, deixando o mes sem
    # nenhuma copia. Com `always`, o job fica vermelho — para o erro nao passar
    # despercebido — mas o arquivo sobe do mesmo jeito.
    when: always
    # Copia de curto prazo dentro do proprio GitLab; a copia definitiva vai
    # para o armazenamento externo configurado em ci/backup-dataset.sh.
    expire_in: 6 months
